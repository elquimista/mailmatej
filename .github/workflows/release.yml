# Builds the release app for every pushed tag and publishes it as that tag's GitHub release.
# A tag like v1.2.0 stamps version 1.2.0; a tag with a hyphen (v1.3.0-beta1) makes a pre-release.
#
# Signing: with the MACOS_CERTIFICATE_P12 (base64 of an exported .p12 with the Apple Development
# certificate and its key) and MACOS_CERTIFICATE_PASSWORD secrets set, the app is signed with that
# certificate, so it keeps its Team ID and the keychain doesn't ask again after updating. Without
# them it is signed ad hoc.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number counts commits

      - name: Use the newest stable Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | grep -vi -e beta -e rc | sort -V | tail -1)"
          sudo xcode-select -s "$xcode"
          swift --version

      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::warning::No MACOS_CERTIFICATE_P12 secret: the app will be signed ad hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Test
        run: swift test

      - name: Build
        run: |
          version="${GITHUB_REF_NAME#v}"
          MMJ_VERSION="$version" scripts/bundle.sh
          ditto -c -k --keepParent build/MailMateJ.app "MailMateJ-$version.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "MailMateJ-$version.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "MailMateJ-$version.zip" --verify-tag \
              --title "MailMateJ $version" --generate-notes $prerelease
          fi

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
