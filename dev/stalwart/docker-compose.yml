# Local Stalwart for developing MailMateJ.
#   docker compose up -d
#   python3 seed.py          # creates test accounts and mail
# JMAP: http://localhost:18080  ·  IMAP: localhost:1143  ·  SMTP: localhost:1025
services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: mmj-stalwart
    # Loopback only: the admin and test passwords are in this repo, so nothing else on the network
    # may reach this server.
    ports:
      - "127.0.0.1:18080:8080"  # 18080 on the Mac: 8080 is commonly taken by other dev servers
      - "127.0.0.1:1143:143"
      - "127.0.0.1:1025:25"
    volumes:
      - ./data/etc:/etc/stalwart
      - ./data/lib:/var/lib/stalwart
    environment:
      # Dev-only server; fixed bootstrap admin so seed.py can configure it.
      STALWART_RECOVERY_ADMIN: "admin:mmj-dev-admin"
    restart: unless-stopped
